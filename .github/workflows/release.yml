name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" advlint.py \
            --title "advlint $GITHUB_REF_NAME" \
            --notes "Single-file Minecraft datapack advancement validator with parent-cycle detection. Run with Python 3.9+: python advlint.py datapacks/mypack"